services:
  server:
    build: .
    image: syncbox:latest
    ports:
      - "${SYNCBOX_PORT:-8080}:${SYNCBOX_PORT:-8080}"
    volumes:
      - "${SYNCBOX_DATA_DIR:-./data}:/data"
    command: ["--data-dir", "/data", "--port", "${SYNCBOX_PORT:-8080}"]

  client:
    build: .
    image: syncbox:latest
    entrypoint: ["bundle", "exec", "ruby", "bin/syncbox"]
    command: []
    volumes:
      - "${SYNCBOX_CLIENT_DIR:-.}:/workdir"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  test:
    build: .
    image: syncbox:latest
    entrypoint: ["bundle", "exec", "rspec"]
    command: []
