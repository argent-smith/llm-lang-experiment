services:
  server:
    build: .
    environment:
      SYNCBOX_DATA_DIR: /data
      SYNCBOX_PORT: ${SYNCBOX_PORT:-8080}
    volumes:
      - ${SYNCBOX_DATA_DIR:-/tmp}:/data
    ports:
      - "${SYNCBOX_PORT:-8080}:${SYNCBOX_PORT:-8080}"

  tests:
    build: .
    command: ["bundle", "exec", "rspec"]
