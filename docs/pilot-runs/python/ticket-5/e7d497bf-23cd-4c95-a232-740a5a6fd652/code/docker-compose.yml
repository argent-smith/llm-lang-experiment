services:
  server:
    build: .
    image: syncbox-server
    pull_policy: build
    environment:
      SYNCBOX_DATA_DIR: /data
      SYNCBOX_PORT: ${SYNCBOX_PORT:-8080}
    volumes:
      - ${SYNCBOX_DATA_DIR_HOST:-./.syncbox-data}:/data
    ports:
      - "${SYNCBOX_PORT:-8080}:${SYNCBOX_PORT:-8080}"

  tests:
    build: .
    image: syncbox-tests
    pull_policy: build
    command: ["python", "-m", "pytest", "-q"]
