name: syncbox

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${SYNCBOX_DATA_DIR:-.}:/data
    ports:
      - "${SYNCBOX_PORT:-8080}:${SYNCBOX_PORT:-8080}"
    command: ["--data-dir", "/data", "--port", "${SYNCBOX_PORT:-8080}"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    working_dir: /src
    entrypoint: ["go", "test", "./..."]
