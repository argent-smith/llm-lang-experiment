services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SYNCBOX_DATA_DIR: /data
      SYNCBOX_PORT: "${SYNCBOX_PORT:-8080}"
    ports:
      - "${SYNCBOX_PORT:-8080}:${SYNCBOX_PORT:-8080}"
    volumes:
      - "${SYNCBOX_DATA_DIR:?SYNCBOX_DATA_DIR must be set (absolute host path)}:/data"
