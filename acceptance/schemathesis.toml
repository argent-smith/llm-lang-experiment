# Конфиг Schemathesis для acceptance/contract-test.sh.
#
# Единственная задача — держать формальную контрактную проверку в рамках
# того, что описано в SYNCBOX-SPEC.md и syncbox-openapi.yaml: методы
# GET/PUT/DELETE на /blobs/{key}, GET /blobs, GET /healthz. Реакция на
# методы вне контракта (TRACE/OPTIONS/QUERY/CONNECT/PATCH и т. п.) в
# спецификации намеренно не зафиксирована — эталонная реализация просто
# наследует поведение стандартного HTTP-сервера языка, и разные пилотные
# реализации отвечают на них по-разному (405 у одних, 501 у других).
# Schemathesis 4.x в фазе coverage по умолчанию сам генерит запросы
# неизвестными методами и проваливает not_a_server_error на 501 — это
# измеряло бы не контракт, а идиому HTTP-стека языка. unexpected-methods = []
# полностью отключает этот подтест, оставляя всё остальное (граничные и
# мусорные значения key, проверку схемы ответов, 5xx на легитимных
# методах) как есть.
#
# Версия schemathesis закреплена в Makefile (цель venv) — тот же принцип,
# что и точный ID модели: генератор не должен дрейфовать между прогонами.

[phases.coverage]
unexpected-methods = []
