# Всё Docker-хозяйство эталонной реализации идёт через compose — run-server
# и run-client лишь дёргают `docker compose`, сырых `docker run`/`docker
# build` в обёртках больше нет. PORT/DATA_DIR/LOCAL_DIR подставляются из
# окружения самими обёртками (см. run-server, run-client).
#
# server и client — в общей сети проекта, которую compose создаёт сам
# (никакого network_mode/depends_on): клиент обращается к серверу по
# имени сервиса ("server"), это резолвит встроенный DNS compose. Раньше
# здесь был network_mode: "service:server" (чтобы 127.0.0.1:<port> внутри
# клиента совпадал с тем, что видит хост) — отказались: он неявно требует
# запущенный server для самого сетевого прикрепления, из-за чего docker
# compose run client молча поднимал server, даже если тот не должен был
# существовать — тест на «сервер недоступен» переставал быть тестом.
# С обычной сетью «сервер недоступен» — это просто провал резолва DNS
# или соединения к имени сервиса, без побочных автозапусков.
services:
  server:
    build: .
    command: ["python3", "server.py", "--data-dir", "/data", "--port", "${PORT:?PORT is required}"]
    ports:
      - "${PORT:?PORT is required}:${PORT:?PORT is required}"
    # cached: хост — источник истины для этого тома, контейнеру можно
    # чуть отставать в обмен на скорость (актуально для legacy
    # gRPC-FUSE на Docker Desktop; VirtioFS и Linux-бэкенды этот
    # модификатор игнорируют, но не отвергают).
    volumes:
      - "${DATA_DIR:-/tmp/syncbox-unused}:/data:cached"

  client:
    build: .
    # profiles, а не depends_on: client не должен подниматься при голом
    # `docker compose up` (без него — старт с пустым CMD, там нет
    # команды по умолчанию) и не должен сам поднимать server как
    # неявную зависимость (это ровно то, от чего отказались с
    # network_mode выше — тест «сервер недоступен» должен оставаться
    # тестом). Явный `docker compose run client ...` (см. run-client)
    # работает независимо от профиля — так и было задумано в самом
    # compose: явное указание сервиса всегда обходит profile-фильтр.
    profiles: ["client"]
    volumes:
      - "${LOCAL_DIR:-/tmp/syncbox-unused}:${LOCAL_DIR:-/tmp/syncbox-unused}:cached"
