// Явный, версионируемый конфиг для внешней code quality-проверки
// Scala-пилота (scripts/run-code-quality.sh) — не .scalafix.conf
// самого пилотного проекта (пилотный агент этот файл не видит).
// Путь передаётся через sbt-настройку `ThisBuild / scalafixConfig`
// извне — файл никогда не копируется и не пишется в директорию
// пилота (тот же принцип неинвазивности, что у ruff.toml/.rubocop.yml/
// eslint.config.js остальных языков).
//
// Синтаксические правила (DisableSyntax, LeakingImplicitClassVal,
// NoValInForComprehension, ProcedureSyntax, RedundantSyntax) не
// требуют SemanticDB — работают всегда. Семантические (RemoveUnused,
// OrganizeImports, NoAutoTupling) требуют SemanticDB — включаются
// отдельно через `scalafixEnable` в самом вызове (не через
// `--syntactic`), см. scripts/run-code-quality.sh.
//
// ExplicitResultTypes (вставка явных типов результата) сознательно
// НЕ включён — это выбор стиля, не хуже/лучше объективно (Scala 3
// поощряет вывод типов для локальных def), в отличие от
// RemoveUnused/OrganizeImports, которые ближе к объективной гигиене
// кода. Комплексность/длина метода — то, что есть у ruff (C90/PLR),
// golangci-lint (gocyclo/funlen), reek (TooManyStatements) — у
// Scalafix встроенных правил такого класса НЕТ; это открытый пробел,
// не наше упущение конфига (см. CLAUDE.md, таблица инструментов
// code quality — колонка «Архитектурные/структурные находки» для
// Scala отмечена «—», не «Да»).
rules = [
  DisableSyntax
  LeakingImplicitClassVal
  NoValInForComprehension
  ProcedureSyntax
  RedundantSyntax
  RemoveUnused
  OrganizeImports
  NoAutoTupling
]

# Консервативный, некомплитный набор — то, что большинство Scala-гайдов
# считает объективно небезопасным/устаревшим, не проект-специфичный
# стиль (аналог "conventional starting point", как и в конфигах
# остальных языков): var/null/throw/return как control-flow, XML-
# литералы, override finalize(), == на несвязанных типах.
DisableSyntax.noVars = true
DisableSyntax.noNulls = true
DisableSyntax.noThrows = true
DisableSyntax.noReturns = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
DisableSyntax.noUniversalEquality = true

# RemoveUnused и OrganizeImports конфликтуют на импортах, если оба
# правят их одновременно ("conflicting patches and broken code",
# подтверждено документацией) — OrganizeImports.removeUnused (true по
# умолчанию) берёт эту задачу на себя, RemoveUnused.imports здесь
# выключен, остальные его проверки (privates/locals/patternvars/params
# — тоже true по умолчанию) остаются активными.
RemoveUnused.imports = false
