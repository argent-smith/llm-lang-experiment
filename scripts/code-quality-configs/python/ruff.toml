# Явный, версионируемый набор правил для внешней code quality-проверки
# пилотных проектов (scripts/run-code-quality.sh) — не конфиг самого
# пилотного проекта, пилотный агент этот файл не видит и не читает.
#
# E, W, F, UP, B, I — конвенциональный стартовый набор для новых
# Python-проектов (pycodestyle errors/warnings, Pyflakes, pyupgrade,
# flake8-bugbear, isort), подтверждён независимо несколькими текущими
# источниками, а не выбран произвольно — см. коммит, добавивший этот
# файл. Ruff по умолчанию (без --config) включает более узкий набор
# (E4/E7/E9/F) — этот файл сознательно шире дефолта, чтобы отражать
# то, что реально принято в новых проектах, а не голый минимум самого
# инструмента.
#
# C90 (mccabe-сложность) и PLR (pylint refactor — LongParameterList,
# too-many-branches и т. п.) добавлены отдельно: архитектурные/
# структурные находки в область этой проверки сознательно включены.
#
# Security-ориентированные категории (S — flake8-bandit) сюда
# намеренно не включены: code security исключён из метода отдельным
# решением, см. docs/PILOT-COMPARISON-python-go.md, раздел
# «Code security (исключено)».

[lint]
select = ["E", "W", "F", "UP", "B", "I", "C90", "PLR"]
