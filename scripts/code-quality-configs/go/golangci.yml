# Явный, версионируемый набор линтеров для внешней code quality-
# проверки пилотных проектов (scripts/run-code-quality.sh) — не
# конфиг самого пилотного проекта, пилотный агент этот файл не видит.
#
# errcheck, govet, ineffassign, revive, staticcheck, unused —
# конвенциональная стартовая точка для "серьёзного" Go-проекта поверх
# голого дефолта golangci-lint (errcheck/govet/ineffassign/
# staticcheck/unused — на один линтер уже, без revive), подтверждена
# независимо несколькими текущими источниками, а не выбрана
# произвольно — см. коммит, добавивший этот файл. `gosimple` в этот
# список не входит: в golangci-lint v2 он поглощён staticcheck, как
# отдельный линтер больше не существует (проверено — `golangci-lint
# help linters` его не перечисляет).
#
# gocyclo, funlen, dupl добавлены отдельно: архитектурные/структурные
# находки (цикломатическая сложность, длина функции, дублирование
# кода) в область этой проверки сознательно включены.
#
# Security-ориентированные линтеры (gosec и т. п.) сюда намеренно не
# включены: code security исключён из метода отдельным решением, см.
# docs/PILOT-COMPARISON-python-go.md, раздел «Code security
# (исключено)».

version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - gocyclo
    - funlen
    - dupl
